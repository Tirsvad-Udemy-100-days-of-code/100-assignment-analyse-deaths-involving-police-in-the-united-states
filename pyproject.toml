[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fatal-force"
version = "0.1.0"
description = "Day 100 assignment: analyse deaths involving police in the United States"
readme = "README.md"
requires-python = ">=3.14"
license = "AGPL-3.0-or-later"
dependencies = []

[project.optional-dependencies]
analysis = [
    "polars>=1.0",
    "matplotlib>=3.9",
    "plotly>=5.24",
    "kaleido>=1.0",
    "jupyterlab>=4.2",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
strict = true
python_version = "3.14"
mypy_path = "src"

[tool.importlinter]
root_package = "fatal_force"

[[tool.importlinter.contracts]]
name = "Layers point inward"
type = "layers"
layers = [
    "fatal_force.presentation",
    "fatal_force.infrastructure",
    "fatal_force.application",
    "fatal_force.domain",
]
